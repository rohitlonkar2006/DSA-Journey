<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title desc">
  <title id="title">DSA learning path</title>
  <desc id="desc">A learning progression from fundamentals to recursion and arrays</desc>
  <rect width="1000" height="220" rx="20" fill="#F8FAFC"/>
  <text x="50" y="48" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Learning Path</text>
  <path d="M100 128H900" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <circle cx="100" cy="128" r="28" fill="#2563EB"/>
      <text x="100" y="135" fill="#FFFFFF" font-size="18" font-weight="700">01</text>
      <text x="100" y="182" fill="#334155" font-size="16" font-weight="600">Basics</text>
    </g>
    <g>
      <circle cx="260" cy="128" r="28" fill="#2563EB"/>
      <text x="260" y="135" fill="#FFFFFF" font-size="18" font-weight="700">02</text>
      <text x="260" y="182" fill="#334155" font-size="16" font-weight="600">Practice</text>
    </g>
    <g>
      <circle cx="420" cy="128" r="28" fill="#2563EB"/>
      <text x="420" y="135" fill="#FFFFFF" font-size="18" font-weight="700">03</text>
      <text x="420" y="182" fill="#334155" font-size="16" font-weight="600">Iteration</text>
    </g>
    <g>
      <circle cx="580" cy="128" r="28" fill="#2563EB"/>
      <text x="580" y="135" fill="#FFFFFF" font-size="18" font-weight="700">04</text>
      <text x="580" y="182" fill="#334155" font-size="16" font-weight="600">Logic</text>
    </g>
    <g>
      <circle cx="740" cy="128" r="28" fill="#7C3AED"/>
      <text x="740" y="135" fill="#FFFFFF" font-size="18" font-weight="700">05-06</text>
      <text x="740" y="182" fill="#334155" font-size="16" font-weight="600">Recursion</text>
    </g>
    <g>
      <circle cx="900" cy="128" r="28" fill="#0891B2"/>
      <text x="900" y="135" fill="#FFFFFF" font-size="18" font-weight="700">07</text>
      <text x="900" y="182" fill="#334155" font-size="16" font-weight="600">Arrays</text>
    </g>
  </g>
</svg>
