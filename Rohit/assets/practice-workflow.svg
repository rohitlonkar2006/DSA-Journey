<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Recommended practice workflow</title>
  <desc id="desc">Understand, solve, analyze, and review</desc>
  <rect width="1000" height="300" rx="20" fill="#0F172A"/>
  <text x="50" y="52" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">A Better Practice Workflow</text>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g>
      <rect x="55" y="95" width="180" height="130" rx="16" fill="#1E293B" stroke="#334155"/>
      <circle cx="145" cy="130" r="24" fill="#2563EB"/>
      <text x="145" y="138" fill="#FFFFFF" font-size="20" font-weight="700">1</text>
      <text x="145" y="180" fill="#FFFFFF" font-size="18" font-weight="700">Understand</text>
      <text x="145" y="205" fill="#94A3B8" font-size="14">Read and clarify</text>
    </g>
    <path d="M235 160h80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect x="315" y="95" width="180" height="130" rx="16" fill="#1E293B" stroke="#334155"/>
      <circle cx="405" cy="130" r="24" fill="#7C3AED"/>
      <text x="405" y="138" fill="#FFFFFF" font-size="20" font-weight="700">2</text>
      <text x="405" y="180" fill="#FFFFFF" font-size="18" font-weight="700">Solve</text>
      <text x="405" y="205" fill="#94A3B8" font-size="14">Design independently</text>
    </g>
    <path d="M495 160h80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect x="575" y="95" width="180" height="130" rx="16" fill="#1E293B" stroke="#334155"/>
      <circle cx="665" cy="130" r="24" fill="#0891B2"/>
      <text x="665" y="138" fill="#FFFFFF" font-size="20" font-weight="700">3</text>
      <text x="665" y="180" fill="#FFFFFF" font-size="18" font-weight="700">Analyze</text>
      <text x="665" y="205" fill="#94A3B8" font-size="14">Time and space</text>
    </g>
    <path d="M755 160h80" stroke="#64748B" stroke-width="4" stroke-linecap="round"/>
    <g>
      <rect x="835" y="95" width="110" height="130" rx="16" fill="#1E293B" stroke="#334155"/>
      <circle cx="890" cy="130" r="24" fill="#059669"/>
      <text x="890" y="138" fill="#FFFFFF" font-size="20" font-weight="700">4</text>
      <text x="890" y="180" fill="#FFFFFF" font-size="18" font-weight="700">Review</text>
      <text x="890" y="205" fill="#94A3B8" font-size="12">Revise later</text>
    </g>
  </g>
</svg>
